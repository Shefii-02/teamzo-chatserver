# /etc/nginx/sites-available/chatserver.teamzo.io  (then: certbot --nginx -d chatserver.teamzo.io)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name chatserver.teamzo.io;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name chatserver.teamzo.io;
    ssl_certificate     /etc/letsencrypt/live/chatserver.teamzo.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatserver.teamzo.io/privkey.pem;

    client_max_body_size 5m;

    # Server-to-server calls from Laravel are on the same host (http://127.0.0.1:3005); only browsers/apps come here.
    # /api/internal/* is guarded by X-Internal-Key; block it from the public internet as defence in depth.
    location /api/internal/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # WebSocket upgrade for /socket.io
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;                      # > socket.io pingInterval+pingTimeout (45s)
    }
}
